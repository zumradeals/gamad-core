# Déploiement Railway / Nixpacks — vue web du Registre des normes (CAP-CORE-007).
#
# Déployer le dépôt ENTIER : le service lit le corpus `genesis-ii/` à la racine
# pour en dériver son index. Ne pas régler de « Root Directory » sur core/…,
# sinon le corpus ne serait pas présent.
#
# Premier regard = SQLite, sans aucun secret : l'index se reconstruit à chaque
# démarrage depuis les fichiers du dépôt. La persistance PostgreSQL (variable
# DATABASE_URL) est une étape ultérieure, dont le secret se consigne au registre
# des accès de l'autorité (ADOPTION-0025, Art. 3.a).
#
# Si l'autodétection diffère, régler la commande de démarrage à la main dans
# l'interface Railway :
#   php -S 0.0.0.0:$PORT -t core/registre-normes/public

providers = ["php"]

[start]
cmd = "php -S 0.0.0.0:$PORT -t core/registre-normes/public"
