services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gamad
      POSTGRES_USER: gamad
      POSTGRES_PASSWORD: gamad
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamad -d gamad"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - gamad_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro

  outbox-worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GAMAD_PG_DSN: pgsql:host=postgres;port=5432;dbname=gamad
      GAMAD_PG_USER: gamad
      GAMAD_PG_PASSWORD: gamad
      GAMAD_EVENT_BUS: stdout
      GAMAD_WORKER_ID: docker-outbox-1
      GAMAD_OUTBOX_BATCH_SIZE: 100
      GAMAD_OUTBOX_LOCK_SECONDS: 60
      GAMAD_OUTBOX_POLL_MS: 1000
      GAMAD_HEARTBEAT_SECONDS: 15
      GAMAD_WORKER_STALE_SECONDS: 45
    healthcheck:
      test: ["CMD", "php", "bin/worker-health", "readiness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  admin-api:
    build: .
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/index.php"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GAMAD_PG_DSN: pgsql:host=postgres;port=5432;dbname=gamad
      GAMAD_PG_USER: gamad
      GAMAD_PG_PASSWORD: gamad
      GAMAD_WORKER_STALE_SECONDS: 45
      GAMAD_ADMIN_TOKENS_JSON: >-
        {"development-admin-token":{"actor_id":"GAM-PER-000001","scopes":["core.runtime.health.read","core.outbox.dashboard.read","core.outbox.dead_letter.read","core.outbox.dead_letter.replay"]}}
    ports:
      - "8080:8080"
    restart: unless-stopped

  console:
    build: ./console
    depends_on:
      - admin-api
    environment:
      GAMAD_CORE_API_BASE_URL: http://admin-api:8080
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  gamad_pgdata:
