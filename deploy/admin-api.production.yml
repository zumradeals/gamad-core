services:
  admin-api:
    image: ${GAMAD_CORE_IMAGE:?GAMAD_CORE_IMAGE is required}
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/index.php"]
    environment:
      GAMAD_PG_DSN: ${GAMAD_PG_DSN:?required}
      GAMAD_PG_USER: ${GAMAD_PG_USER:?required}
      GAMAD_PG_PASSWORD: ${GAMAD_PG_PASSWORD:?required}
      GAMAD_OIDC_ISSUER: ${GAMAD_OIDC_ISSUER:?required}
      GAMAD_OIDC_AUDIENCE: ${GAMAD_OIDC_AUDIENCE:?required}
      GAMAD_OIDC_JWKS_URI: ${GAMAD_OIDC_JWKS_URI:?required}
      GAMAD_OIDC_JWKS_CACHE_FILE: /app/var/cache/jwks.json
      GAMAD_OIDC_JWKS_TTL_SECONDS: ${GAMAD_OIDC_JWKS_TTL_SECONDS:-3600}
      GAMAD_OIDC_CLOCK_SKEW_SECONDS: ${GAMAD_OIDC_CLOCK_SKEW_SECONDS:-60}
      GAMAD_ADMIN_PERMISSIONS_JSON: ${GAMAD_ADMIN_PERMISSIONS_JSON:-{}}
      GAMAD_ADMIN_RATE_LIMIT: ${GAMAD_ADMIN_RATE_LIMIT:-120}
      GAMAD_ADMIN_RATE_WINDOW_SECONDS: ${GAMAD_ADMIN_RATE_WINDOW_SECONDS:-60}
      GAMAD_WORKER_STALE_SECONDS: ${GAMAD_WORKER_STALE_SECONDS:-45}
      GAMAD_HEALTHCHECK_TOKEN: ${GAMAD_HEALTHCHECK_TOKEN:?required}
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /app/var/cache:size=16m,noexec,nosuid,nodev,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Authorization: Bearer '$$GAMAD_HEALTHCHECK_TOKEN http://127.0.0.1:8080/admin/runtime/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    expose:
      - "8080"
