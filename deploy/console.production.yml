services:
  console:
    image: ${GAMAD_CONSOLE_IMAGE:?GAMAD_CONSOLE_IMAGE is required}
    command: ["php", "-S", "0.0.0.0:8081", "-t", "public", "public/index.php"]
    environment:
      GAMAD_CORE_API_BASE_URL: ${GAMAD_CORE_API_BASE_URL:?required}
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    expose:
      - "8081"
