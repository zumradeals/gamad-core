openapi: 3.1.0
info:
  title: GAMAD Core Identity Registry API
  version: 1.1.0-alpha
paths:
  /identities:
    post:
      operationId: registerIdentity
      security: [{ bearerAuth: [core.identity.register] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterIdentityRequest' }
      responses:
        '201': { description: Identity registered, content: { application/json: { schema: { $ref: '#/components/schemas/Identity' } } } }
        '409': { description: Idempotency conflict }
    get:
      operationId: searchIdentities
      security: [{ bearerAuth: [core.identity.read] }]
      parameters:
        - in: query
          name: type
          schema: { $ref: '#/components/schemas/IdentityType' }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/IdentityStatus' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Paginated identity list
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Identity' } }
                  next_cursor: { type: [string, 'null'] }
  /identities/bulk:
    post:
      operationId: bulkRegisterIdentities
      security: [{ bearerAuth: [core.identity.register] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              additionalProperties: false
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/RegisterIdentityRequest' }
      responses:
        '201':
          description: Identities registered atomically
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Identity' } }
                  count: { type: integer, minimum: 1, maximum: 100 }
  /identities/{identityId}:
    get:
      operationId: getIdentity
      security: [{ bearerAuth: [core.identity.read] }]
      parameters:
        - in: path
          name: identityId
          required: true
          schema: { type: string, pattern: '^GAM-[A-Z0-9]{2,6}-[A-Z]{3}-[0-9]{6,}$' }
      responses:
        '200': { description: Identity, content: { application/json: { schema: { $ref: '#/components/schemas/Identity' } } } }
        '404': { description: Not found }
  /identities/{identityId}/{transition}:
    post:
      operationId: transitionIdentity
      security: [{ bearerAuth: [core.identity.lifecycle.manage] }]
      parameters:
        - in: path
          name: identityId
          required: true
          schema: { type: string, pattern: '^GAM-[A-Z0-9]{2,6}-[A-Z]{3}-[0-9]{6,}$' }
        - in: path
          name: transition
          required: true
          schema: { type: string, enum: [activate, suspend, archive, revoke] }
      responses:
        '200': { description: Updated identity, content: { application/json: { schema: { $ref: '#/components/schemas/Identity' } } } }
        '404': { description: Not found }
        '409': { description: Invalid lifecycle transition }
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            core.identity.register: Register identities
            core.identity.read: Read identities
            core.identity.lifecycle.manage: Manage identity lifecycle
  schemas:
    IdentityType:
      type: string
      enum: [person, organization, application, service, agent, device, resource]
    IdentityStatus:
      type: string
      enum: [draft, active, suspended, archived, revoked]
    RegisterIdentityRequest:
      type: object
      required: [identity_type]
      additionalProperties: false
      properties:
        identity_type: { $ref: '#/components/schemas/IdentityType' }
    Identity:
      type: object
      required: [identity_id, identity_type, status, registered_at, realm]
      properties:
        identity_id: { type: string, pattern: '^GAM-[A-Z0-9]{2,6}-[A-Z]{3}-[0-9]{6,}$' }
        identity_type: { $ref: '#/components/schemas/IdentityType' }
        status: { $ref: '#/components/schemas/IdentityStatus' }
        registered_at: { type: string, format: date-time }
        realm: { type: string, pattern: '^[A-Z0-9]{2,6}$' }
