openapi: 3.1.0
info:
  title: GAMAD Core Persons and User Accounts API
  version: 1.0.0-alpha
  description: >
    Persons, user accounts, authentication methods and sessions (GENESIS-009,
    GENESIS-010). Authentication here is a session token issued by
    /auth/login — never the administrative bootstrap mechanism of ADR-0011.
paths:
  /persons:
    post:
      operationId: registerPerson
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPersonRequest' }
      responses:
        '201': { description: Person registered, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } }
        '409': { description: Identity not eligible, or person already registered }
  /persons/{personId}:
    get:
      operationId: getPerson
      security:
        - sessionAuth: []
      parameters:
        - in: path
          name: personId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Person, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } }
        '404': { description: Person not found }
  /persons/{personId}/account:
    post:
      operationId: registerUserAccount
      security:
        - sessionAuth: []
      parameters:
        - in: path
          name: personId
          required: true
          schema: { type: string }
      responses:
        '201': { description: Account created, content: { application/json: { schema: { $ref: '#/components/schemas/UserAccount' } } } }
        '404': { description: Person not found }
        '409': { description: Person already has an account }
  /accounts/{accountId}/password:
    post:
      operationId: setPassword
      security:
        - sessionAuth: []
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPasswordRequest' }
      responses:
        '204': { description: Password set }
        '404': { description: Account not found }
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Session issued, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '401': { description: Invalid credentials }
  /sessions/{sessionId}/revoke:
    post:
      operationId: revokeSession
      security:
        - sessionAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Session revoked }
        '404': { description: Session not found }
components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      description: >
        Bearer token returned by /auth/login. Not the ADR-0011 administrative
        bootstrap mechanism — a distinct session issued by this context
        (ADR-0018 §3).
  schemas:
    RegisterPersonRequest:
      type: object
      required: [identity_id, declared_name, contact]
      additionalProperties: false
      properties:
        identity_id: { type: string, pattern: '^GAM-[A-Z0-9]{2,6}-[A-Z]{3}-[0-9]{6,}$' }
        declared_name: { type: string, minLength: 1 }
        contact: { type: string, minLength: 1 }
    Person:
      type: object
      required: [person_id, declared_name, status, registered_at]
      properties:
        person_id: { type: string }
        declared_name: { type: string }
        status: { type: string, enum: [active, inactive, deceased] }
        registered_at: { type: string, format: date-time }
        contact: { type: [string, 'null'] }
    UserAccount:
      type: object
      required: [account_id, person_id, status, created_at]
      properties:
        account_id: { type: string, format: uuid }
        person_id: { type: string }
        status: { type: string, enum: [active, suspended, disabled] }
        created_at: { type: string, format: date-time }
    SetPasswordRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, minLength: 1 }
    LoginRequest:
      type: object
      required: [person_id, password]
      additionalProperties: false
      properties:
        person_id: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
