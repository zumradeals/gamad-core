openapi: 3.1.0
info:
  title: GAMAD Core Access Control API
  version: 1.0.0-alpha
  description: >
    Roles, permissions and role assignments (GENESIS-013, GENESIS-014,
    DIRECTIVE-007). Authentication here is the same session token issued by
    /auth/login (Persons and User Accounts, ADR-0018) — never the
    administrative bootstrap mechanism of ADR-0011. No route is public;
    every route additionally requires the matching permission
    (GENESIS-013 §3.4), evaluated by the engine this context itself owns.
paths:
  /permissions:
    post:
      operationId: createPermission
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePermissionRequest' }
      responses:
        '201': { description: Permission created, content: { application/json: { schema: { $ref: '#/components/schemas/Permission' } } } }
        '403': { description: Actor lacks role:create }
        '409': { description: Permission name already registered }
    get:
      operationId: listPermissions
      security:
        - sessionAuth: []
      responses:
        '200':
          description: All registered permissions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Permission' }
        '403': { description: Actor lacks role:read }
  /roles:
    post:
      operationId: createRole
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201': { description: Role created, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
        '400': { description: Unknown role scope }
        '403': { description: Actor lacks role:create }
        '409': { description: Role name already registered }
    get:
      operationId: listRoles
      security:
        - sessionAuth: []
      responses:
        '200':
          description: All registered roles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
        '403': { description: Actor lacks role:read }
  /roles/{roleId}/permissions:
    post:
      operationId: addPermissionToRole
      security:
        - sessionAuth: []
      parameters:
        - in: path
          name: roleId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddPermissionToRoleRequest' }
      responses:
        '200': { description: Permission added, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
        '403': { description: Actor lacks permission:assign }
        '404': { description: Role or permission not found }
  /role-assignments:
    post:
      operationId: assignRole
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRoleRequest' }
      responses:
        '201': { description: Role assigned, content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignment' } } } }
        '403': { description: Self-assignment, or actor lacks role:assign }
        '404': { description: Role, person or organization not found }
        '409': { description: Person already holds this role in this organization }
  /role-assignments/{assignmentId}:
    delete:
      operationId: revokeRole
      security:
        - sessionAuth: []
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Role assignment revoked, content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignment' } } } }
        '403': { description: Actor lacks role:revoke }
        '404': { description: Role assignment not found }
  /access/evaluate:
    post:
      operationId: evaluateAccess
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateAccessRequest' }
      responses:
        '200':
          description: The access decision — always ALLOW or DENY, never a third value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessDecision' }
        '403': { description: Actor lacks runtime:health:read }
components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      description: >
        Bearer token returned by /auth/login (Persons and User Accounts). Not
        the ADR-0011 administrative bootstrap mechanism.
  schemas:
    CreatePermissionRequest:
      type: object
      required: [name, description]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '^[a-z][a-z_-]*(:[a-z][a-z_-]*){1,2}$' }
        description: { type: string, minLength: 1 }
    Permission:
      type: object
      required: [permission_id, name, description]
      properties:
        permission_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
    CreateRoleRequest:
      type: object
      required: [name, scope]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        scope: { type: string, enum: [realm, organization] }
    Role:
      type: object
      required: [role_id, name, scope, status]
      properties:
        role_id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: [realm, organization] }
        status: { type: string, enum: [active, deprecated] }
        permission_ids:
          type: array
          items: { type: string, format: uuid }
    AddPermissionToRoleRequest:
      type: object
      required: [permission_id]
      additionalProperties: false
      properties:
        permission_id: { type: string, format: uuid }
    AssignRoleRequest:
      type: object
      required: [role_id, person_id, organization_id]
      additionalProperties: false
      properties:
        role_id: { type: string, format: uuid }
        person_id: { type: string }
        organization_id: { type: string }
    RoleAssignment:
      type: object
      required: [assignment_id, role_id, person_id, organization_id, status]
      properties:
        assignment_id: { type: string, format: uuid }
        role_id: { type: string, format: uuid }
        person_id: { type: string }
        organization_id: { type: string }
        status: { type: string, enum: [active, revoked] }
        assigned_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    EvaluateAccessRequest:
      type: object
      required: [actor_id, action, context_id]
      additionalProperties: false
      properties:
        actor_id: { type: string }
        action: { type: string }
        context_id: { type: string }
    AccessDecision:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [ALLOW, DENY] }
        reason: { type: string }
