        - bearerSession: []
      parameters:
        - $ref: "#/components/parameters/Reference"
        - in: path
          name: version
          required: true
          schema: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$" }
      responses:
        "200":
          description: Version et ses règles.
        "401":
          description: Session invalide.
        "404":
          description: Politique ou version inconnue.
  /politiques/{reference}/versions/{version}/regles:
    post:
      tags: [Politiques]
      operationId: ajouterRegleVersion
      summary: Ajoute une règle à une version en BROUILLON.
      security:
        - bearerSession: []
      parameters:
        - $ref: "#/components/parameters/Reference"
        - in: path
          name: version
          required: true
          schema: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effet, action_reference, motif]
              properties:
                effet: { type: string, enum: [PERMET, REFUSE] }
                action_reference: { type: string, maxLength: 256 }
                sujet_reference: { type: string, maxLength: 64 }
                ressource_reference: { type: string, maxLength: 256 }
                motif: { type: string, maxLength: 2000 }
                ordre: { type: integer, minimum: 1 }
