  /politiques/{reference}/versions/{version}/simulation:
    post:
      tags: [Politiques]
      operationId: simulerVersionPolitique
      summary: Simule une version EN_VALIDATION sur un jeu de cas explicite, sans effet de bord.
      description: >-
        N'évalue jamais les versions actives : seules les règles de la
        version exacte simulée. Une activation exige au moins une simulation
        REUSSIE de cette version.
      security:
        - bearerSession: []
      parameters:
        - $ref: "#/components/parameters/Reference"
        - in: path
          name: version
          required: true
          schema: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jeu_reference, cas]
              properties:
                jeu_reference: { type: string, maxLength: 128 }
                cas:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sujet, action, attendu]
                    properties:
                      sujet: { type: string, maxLength: 64 }
                      action: { type: string, maxLength: 256 }
                      ressource: { type: string, maxLength: 256 }
                      attendu: { type: string, enum: [PERMIS, REFUSE] }
      responses:
        "201":
          description: Simulation enregistrée (résultat REUSSIE, ECHEC ou INCOMPLETE).
        "401":
          description: Session invalide.
        "403":
          description: CAP-CORE-004 refuse la simulation.
        "404":
          description: Politique ou version inconnue.
        "422":
          description: Seule une version EN_VALIDATION se simule.
        "503":
          description: Une dépendance requise est indisponible.
