name: CI

on:
  push:
    branches: [main, cursor]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gamad_test
          POSTGRES_USER: gamad
          POSTGRES_PASSWORD: gamad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamad -d gamad_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Run test suite
        env:
          GAMAD_TEST_PG_DSN: pgsql:host=127.0.0.1;port=5432;dbname=gamad_test
          GAMAD_TEST_PG_USER: gamad
          GAMAD_TEST_PG_PASSWORD: gamad
        run: composer test

      - name: Validate container build
        run: docker build -t gamad-core-worker:ci .
