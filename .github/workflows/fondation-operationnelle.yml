name: Core Operational Foundation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  socle-p0-p1:
    name: Journal, sécurité et refus par défaut
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite

      - name: Exécuter la garde du socle
        run: php core/journal-operationnel/tests/fondation_operationnelle_p3.php

      - name: Installer le monolithe Laravel
        working-directory: apps/console-laravel
        run: composer install --no-interaction --prefer-dist

      - name: Exporter temporairement la baseline opérationnelle
        run: php outils/exporter-baseline-index.php .migration/index-baseline.json

      - name: Publier la baseline temporaire
        uses: actions/upload-artifact@v4
        with:
          name: gamad-index-baseline
          path: .migration/index-baseline.json
          if-no-files-found: error
          retention-days: 1

      - name: Versionner la baseline sur la branche
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          sed -E -i 's/"commit": "[0-9a-f]{40}"/"commit": "3e0203c1e5e980373bccd086e19c633c612bebb1"/' .migration/index-baseline.json
          mkdir -p core/registre-normes/resources
          cp .migration/index-baseline.json core/registre-normes/resources/index-baseline-v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/registre-normes/resources/index-baseline-v1.json
          git commit -m "chore(core): versionner la baseline opérationnelle"
          git push origin HEAD:${{ github.head_ref }}

      - name: Vérifier le raccordement des variables Laravel
        run: php apps/console-laravel/tests/Integration/laravel_env_p0.php

      - name: Exécuter l'intégration HTTP v1
        run: php apps/console-laravel/tests/Integration/api_v1_p1.php

      - name: Éprouver l'authentification console
        run: php apps/console-laravel/tests/Integration/console_auth_p1.php

      - name: Éprouver la console quotidienne
        run: php apps/console-laravel/tests/Integration/console_ux_p1.php

      - name: Éprouver le facteur fort WebAuthn A2
        run: php apps/console-laravel/tests/Integration/passkey_a2_p2.php

      - name: Éprouver l'import SQLite
        run: php apps/console-laravel/tests/Integration/import_sqlite_p0.php

      - name: Éprouver PostgreSQL réel
        run: apps/console-laravel/tests/Integration/postgresql_p0.sh
