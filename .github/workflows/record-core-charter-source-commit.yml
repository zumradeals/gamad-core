name: Record CORE-CHARTER-0001 source commit

on:
  push:
    branches:
      - agent/genesis-ii-core-charter-0001
    paths:
      - .github/workflows/record-core-charter-source-commit.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/genesis-ii-core-charter-0001
          fetch-depth: 0
      - name: Record exact source commit
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git log --diff-filter=A --format=%H -1 -- genesis-ii/charte/CORE-CHARTER-0001-charte-gamad-core.md)"
          test -n "$source_commit"
          mkdir -p genesis-ii/.tmp
          printf '%s\n' "$source_commit" > genesis-ii/.tmp/CORE-CHARTER-0001-SOURCE-COMMIT.txt
          rm -f .github/workflows/record-core-charter-source-commit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(genesis-ii): record CORE-CHARTER-0001 source commit'
          git push origin HEAD:agent/genesis-ii-core-charter-0001
